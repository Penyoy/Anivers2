name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper if missing or placeholder
        run: |
          NEED_GEN=false
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then NEED_GEN=true; fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && grep -q "PLACEHOLDER" gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then NEED_GEN=true; fi
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || stat -f%z gradle/wrapper/gradle-wrapper.jar) -lt 10000 ]; then NEED_GEN=true; fi
          if grep -q "Placeholder" gradlew 2>/dev/null; then NEED_GEN=true; fi
          if [ ! -f gradlew.bat ]; then NEED_GEN=true; fi
          if grep -q "Placeholder" gradlew.bat 2>/dev/null; then NEED_GEN=true; fi
          if [ "$NEED_GEN" = "true" ]; then
            echo "Wrapper missing or placeholder, generating Gradle 8.9 wrapper..."
            curl -sLo gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
            ./gradle-8.9/bin/gradle --stop || true
          else
            echo "Gradle wrapper OK"
          fi

      - name: Setup google-services.json from secret or placeholder
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json 2>/dev/null || echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            echo "Created google-services.json from secret GOOGLE_SERVICES_JSON"
          elif [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"anivers-placeholder","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:placeholder","android_client_info":{"package_name":"com.anivers.anime"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
            echo "Created placeholder google-services.json - replace with real Firebase config"
            echo "Tip: set secret GOOGLE_SERVICES_JSON (base64 of file) for real Firebase"
          else
            echo "google-services.json already exists"
          fi

      - name: Setup Debug Keystore (deterministic if secret provided, else auto-generate)
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using deterministic debug keystore from secret ANDROID_DEBUG_KEYSTORE_BASE64"
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
            mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
            echo "Debug keystore decoded to app/debug.keystore + ~/.android/debug.keystore (SHA-1 will be stable)"
          else
            echo "No ANDROID_DEBUG_KEYSTORE_BASE64 secret - generating ephemeral debug keystore deterministically via keytool (biar gak 'not found')"
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tail -n 5
              echo "Generated ~/.android/debug.keystore"
            else
              echo "Using existing ~/.android/debug.keystore"
            fi
            # Copy to app/debug.keystore juga biar signingConfigs getByName debug yang cek file("debug.keystore") kepakai
            cp ~/.android/debug.keystore app/debug.keystore 2>/dev/null || true
            echo "Copied to app/debug.keystore for deterministic build"
            echo "SHA1 ephemeral ini akan tetap untuk run ini, tapi ganti next run jika tidak set secret. Tip: base64 -w0 app/debug.keystore -> set ANDROID_DEBUG_KEYSTORE_BASE64 biar stabil"
            # Also generate base64 for artifact biar user bisa set secret tanpa keytool lokal
            base64 -w0 app/debug.keystore > debug.b64 2>/dev/null || base64 app/debug.keystore > debug.b64
            echo "Generated debug.b64 for secret upload:"
            head -c 100 debug.b64; echo "..."
          fi
          ls -lh app/debug.keystore ~/.android/debug.keystore 2>&1 | head -n 5

      - name: Setup Release Keystore (if secrets available)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          echo "Keystore decoded to app/release.keystore"
          ls -lh app/release.keystore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get SHA-1 / SHA-256 (debug + release) - COPY THIS TO FIREBASE
        if: always()
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "## SHA-1 Fingerprints — COPY TO FIREBASE" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "Firebase Console → Project Settings → Your apps (com.anivers.anime) → SHA certificate fingerprints → Add fingerprint → paste SHA-1 below → Save → Download new google-services.json → replace app/google-services.json" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "### Debug Keystore" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' | tee -a $GITHUB_STEP_SUMMARY
          # Try app/debug.keystore first (deterministic), else ~/.android/debug.keystore (ephemeral)
          DEBUG_KS=""
          if [ -f app/debug.keystore ]; then DEBUG_KS="app/debug.keystore"; echo "Using app/debug.keystore (deterministic)" | tee -a $GITHUB_STEP_SUMMARY; else DEBUG_KS="$HOME/.android/debug.keystore"; echo "Using ~/.android/debug.keystore (ephemeral, will change next run)" | tee -a $GITHUB_STEP_SUMMARY; fi
          # Prepare downloadable sha1 file (bisa didownload tanpa login Summary)
          echo "SHA-1 Fingerprints - Anivers $(date -Iseconds)" > sha1.txt
          echo "Firebase -> Project Settings -> Your apps (com.anivers.anime) -> Add fingerprint" >> sha1.txt
          echo "" >> sha1.txt
          if [ -f "$DEBUG_KS" ]; then
            keytool -list -v -keystore "$DEBUG_KS" -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep -E "SHA1|SHA256|SHA-256|Valid" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt || echo "keytool debug failed" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            echo "" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            echo "signingReport (debug):" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            ./gradlew signingReport --console=plain 2>/dev/null | grep -A5 "Variant: debug" | head -n 30 | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt || true
          else
            echo "Debug keystore not found at $DEBUG_KS" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          fi
          echo '```' | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          if [ -f app/release.keystore ]; then
            echo "### Release Keystore" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            echo '```' | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            keytool -list -v -keystore app/release.keystore -alias "${ANDROID_KEY_ALIAS:-key0}" -storepass "${ANDROID_KEYSTORE_PASSWORD:-}" -keypass "${ANDROID_KEY_PASSWORD:-}" 2>/dev/null | grep -E "SHA1|SHA256|SHA-256|Valid|Alias" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt || echo "keytool release failed - check alias/pass" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
            echo '```' | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          else
            echo "### Release: no app/release.keystore (skip)" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          fi
          echo "" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          echo "---" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          echo "After copying SHA-1 to Firebase, download new google-services.json and set secret GOOGLE_SERVICES_JSON = base64 -w0 app/google-services.json" | tee -a $GITHUB_STEP_SUMMARY | tee -a sha1.txt
          # Also log to console for raw logs
          cat $GITHUB_STEP_SUMMARY 2>/dev/null | tail -n 60 || true
          cat sha1.txt 2>/dev/null | tail -n 40 || true

      - name: Cleanup Gradle dist
        if: always()
        run: rm -rf gradle-8.9 gradle-8.9-bin.zip || true

      - name: Upload SHA-1 fingerprints (downloadable without login)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sha1-fingerprints
          path: sha1.txt
          if-no-files-found: warn

      - name: Upload Debug Keystore Base64 (deterministic setup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-base64
          path: debug.b64
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anivers-anime-debug.apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (if built)
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: anivers-anime-release.apk
          path: app/build/outputs/apk/release/*.apk

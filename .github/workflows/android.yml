name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing, downloading Gradle 8.9"
            curl -sLo gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon
            ./gradle-8.9/bin/gradle --stop || true
            # jangan hapus gradle-8.9 dulu, biarkan sampai build selesai
          fi

      - name: Create google-services.json placeholder if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"anivers-placeholder","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:placeholder","android_client_info":{"package_name":"com.anivers.anime"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
            echo "Created placeholder google-services.json - replace with real Firebase config for release"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Cleanup Gradle dist
        if: always()
        run: rm -rf gradle-8.9 gradle-8.9-bin.zip || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anivers-debug-apk
          path: app/build/outputs/apk/debug/*.apk
